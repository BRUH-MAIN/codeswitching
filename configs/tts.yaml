# Stage 2: Indic Parler-TTS synthesis.
#
# The paper synthesises with "one Indian male and one Indian female voice".
# The model card's recommended Hindi speakers are Rohit and Divya.
#
# parler-tts hard-pins transformers==4.46.1. That is a resolver constraint, not
# a warning. Install it before importing transformers.

model: ai4bharat/indic-parler-tts   # gated: accept terms on the Hub first
dtype: float16
device: cuda:0

speakers: [Rohit, Divya]            # assigned 50/50 by sha1(sent_id), NOT hash()
batch_size: 8                       # length-sorted buckets keep padding down
seed: 1234

# Indic Parler-TTS emits 44.1 kHz (confirmed at runtime; the model card's 22.05 kHz
# is wrong). synthesize.py reads model.config.sampling_rate rather than trusting this.
source_sr: 44100
target_sr: 16000

# Sharding: a 12h Kaggle session that dies costs at most one shard.
num_shards: 4

subsets:
  train_t2_hours: 22.0
  train_t1_hours: 8.0               # strict subset of T2, stored BY REFERENCE

# GATE 2 targets
expect:
  t2_hours: 22.0
  t1_hours: 8.0
  t1_subset_of_t2: true
