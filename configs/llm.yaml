# Stage 1: LLM few-shot generation.
#
# DEVIATION D1 from the paper, which used Llama-3.3-70B-Instruct (141 GB bf16).
#
# We serve Gemma 4 26B-A4B via llama.cpp: a 25.2B-total / 3.8B-active MoE,
# apache-2.0, UNGATED. Far stronger than the earlier dense E4B (which is why we
# switched -- see D11: E4B's output was too English-heavy and switched too little).
#
# Runtime shape:
#   * ~16 GB in Q4_K_M -> does NOT fit one T4. `tensor_split` spreads the ONE
#     model across both cards, so there is a SINGLE process using both GPUs.
#     Unlike the transformers path, there is NO cross-GPU sharding here.
#   * llama.cpp chat completions are single-stream, so the whole run is slow
#     (~8-12 h). Disabling the model's thinking is what keeps it feasible; every
#     call is cached, so a 12 h session cap is survived by re-running.
#
# Why NOT vLLM: its AWQ kernels need compute capability >= 8.0. Kaggle's T4 is
# sm75 and raises "quantization method awq is not supported for the current GPU".

backend: llamacpp
model: unsloth/gemma-4-26B-A4B-it-GGUF
gguf_file: gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
# Alternatives:
#   backend: transformers, model: google/gemma-4-E4B-it   # dense 4B, batched, shardable
#   backend: transformers, model: Qwen/Qwen2.5-7B-Instruct

llamacpp:
  n_gpu_layers: -1           # offload every layer
  n_ctx: 4096
  tensor_split: [0.5, 0.5]   # even across the 2x T4; auto-computed if omitted
  top_k: 64                  # model card's recommended setting
  disable_thinking: true     # tries enable_thinking=False, then strips reasoning

bigrams:
  n_calls: 4466              # 4466 x 10 ~= the paper's 44,657 raw bigrams
  bigrams_per_call: 10
  sentences_per_prompt: 5    # paper: "batches of five Hindi-English sentences"
  temperature: 0.9
  max_new_tokens: 200

translation_check:
  items_per_call: 20
  n_samples: 3               # self-consistency majority vote
  temperature: 0.7

sentences:
  temperature: 0.8
  max_new_tokens: 256
  max_chars: 400             # Whisper's label cap is 448 tokens

cache_dir: data/llm_cache    # every call is cached: the run survives a 12h timeout
seed: 1234

# GATE 1 targets (paper §3.2.1-3.2.2)
expect:
  raw_bigrams: 44657
  unique_bigrams: 5932
  valid_bigrams: 5477
  sentences: 16000
