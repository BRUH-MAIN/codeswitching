# M8 on an A100: Train_T2 (23.95h synthetic) + Common Voice monolingual.
# Paper: MER 39.2, CBA-HE 55.4, CBA-EH 56.x
#
# ~50h of audio total (D7: CV Hindi yields 11.87h, not 15h -- that is all that
# exists in CV 17). Still a SINGLE <|hi|> prompt for everything: language-
# specific prompting is Track 1's M4, not Track 2.
#
# Expected: ~4% relative MER improvement over M7.
#
# REQUIRES cv_en on the Hub. If it is missing this fails at load time, before any
# GPU work -- run M6 and M7 first, they do not depend on it.
#
# BIGGEST DISK FOOTPRINT: ~37,000 clips x 0.96 MB = ~35.5 GB of featurized Arrow.
# Clear the previous run's cache first (scripts/train_a100.sh does this).
#
# KNOWN DIVERGENCE FROM THE PAPER, unresolved: M8 collapses CBA (test set,
# lenient: CBA-HE 13.2/CBA-EH 14.0 vs M7's 27.2/33.8 and zero-shot's 44.1/40.9)
# instead of improving it to 55.4/56.x like the paper's M8. Ruled out by direct
# investigation (see conversation history / commit log around job 11876):
#   - mono:CS data ratio -- paper's own (30h TrainH+TrainE : 22h Train_T2) is
#     MORE mono-heavy than this repo's (~26.9h cv_hi+cv_en : 22h synth_t2)
#   - the <|hi|> prompt forced onto English-only cv_en -- confirmed the paper
#     does the exact same thing for its own TrainE
#   - LR/optimizer instability -- loss and grad_norm both look normal at the
#     start of M8 training, no spike
#   - per-batch CS:mono dilution -- tried oversample_train: 2 (job 11876/11877):
#     MER barely moved (58.0 -> 57.6) and CBA got slightly WORSE (13.2 -> 12.1 /
#     14.0 -> 12.5), so reverted rather than keep a deviation that doesn't help
#   - corrupted/mislabeled Common Voice transcripts -- spot-checked cv_en
#     (100.0% Latin script) and cv_hi (98.8% Devanagari): both clean
# Every eval across the whole (non-oversampled) M8 run, epoch 0.46 through 4.1,
# showed CBA-HE stuck under ~14% starting from the FIRST checkpoint -- not a
# drift more steps would fix. Root cause still open.
#
# MITIGATION (not a fix): select_by score picks the checkpoint minimizing
# mer/(cba_total+1) instead of raw MER, so a good-MER/collapsed-CBA checkpoint
# can no longer win by default. Hand-checking the 9 dev evals from the plain-
# MER run: this would have picked the epoch-0.46 checkpoint (mer 47.7, best CBA
# in the whole run) over the epoch-2.28 one MER-only selection actually chose
# (mer 45.7, worse CBA) -- a small, real difference, not a resolution of why
# CBA collapses at all. Whether it holds up on the recording-level test decode
# is the open question this run answers. Not applied to M6/M7: their MER-only
# selection already produces the correct paper-direction ordering.

model: openai/whisper-large-v2
out: exp/m8_large
select_by: score

train_hf: RohanRamesh/hi-en-synth-cs
train_config: synth_t2
subset_ids: null

extra_hf:
  - RohanRamesh/mucs-he-cs:cv_hi
  - RohanRamesh/mucs-he-cs:cv_en

dev_hf: RohanRamesh/mucs-he-cs
dev_config: dev

language: hi

lr: 2.0e-5
batch_size: 16
grad_accum: 4
eval_batch_size: 8
max_steps: 5000
warmup_steps: 200
eval_steps: 250
patience: 4
seed: 1234

precision: auto
tf32: auto
gradient_checkpointing: auto
attn_impl: auto
num_proc: 2
dataloader_workers: 2
